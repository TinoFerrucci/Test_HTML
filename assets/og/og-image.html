<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'Inter';
        font-weight: 300 900;
        src: url('../fonts/inter-var.woff2') format('woff2');
    }
    @font-face {
        font-family: 'Space Grotesk';
        font-weight: 400 700;
        src: url('../fonts/space-grotesk-var.woff2') format('woff2');
    }
    @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 400 700;
        src: url('../fonts/jetbrains-mono-var.woff2') format('woff2');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1200px;
        height: 630px;
        background: #050507;
        font-family: 'Inter', system-ui, sans-serif;
        color: #f5f6fa;
        overflow: hidden;
        position: relative;
    }

    /* Same accent ramp the site uses, bled in from the corners. */
    .glow-a, .glow-b {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
    }
    .glow-a {
        width: 620px; height: 620px;
        top: -240px; right: -140px;
        background: rgba(99, 102, 241, 0.40);
    }
    .glow-b {
        width: 520px; height: 520px;
        bottom: -260px; left: -120px;
        background: rgba(168, 85, 247, 0.30);
    }

    /* The hero's retrieval motif, frozen at the moment of a hit. */
    svg.field { position: absolute; inset: 0; width: 1200px; height: 630px; }

    .frame {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, 0.07);
        margin: 22px;
        border-radius: 20px;
    }

    .content {
        position: relative;
        height: 100%;
        padding: 82px 86px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        align-self: flex-start;
        padding: 9px 18px;
        border: 1px solid rgba(129, 140, 248, 0.38);
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.11);
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #c7d2fe;
    }
    .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 12px #4ade80;
    }

    h1 {
        margin-top: 30px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 92px;
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: -0.035em;
        background: linear-gradient(115deg, #a5b4fc 0%, #818cf8 38%, #c084fc 72%, #f472b6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    h2 {
        margin-top: 26px;
        font-size: 35px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: #e6e8f0;
    }

    p {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 400;
        line-height: 1.5;
        color: #9ba1b4;
        max-width: 700px;
    }

    .meta {
        margin-top: 40px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 19px;
        color: #6f7689;
    }
    .sep { color: #3a3f52; }
    .site { color: #a5b4fc; font-weight: 500; }

    .mark {
        position: absolute;
        top: 74px; right: 86px;
        width: 92px; height: 92px;
        border-radius: 22px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 40px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.02em;
        box-shadow: 0 18px 50px rgba(99, 102, 241, 0.42);
    }
</style>
</head>
<body>
    <div class="glow-a"></div>
    <div class="glow-b"></div>

    <svg class="field" aria-hidden="true">
        <g stroke="rgba(129,140,248,0.55)" stroke-width="1.1">
            <line x1="1012" y1="474" x2="946" y2="404"/>
            <line x1="1012" y1="474" x2="1084" y2="418"/>
            <line x1="1012" y1="474" x2="962" y2="546"/>
            <line x1="1012" y1="474" x2="1098" y2="536"/>
            <line x1="1012" y1="474" x2="906" y2="498"/>
        </g>
        <g fill="rgba(165,180,252,0.92)">
            <circle cx="946" cy="404" r="4.2"/>
            <circle cx="1084" cy="418" r="4.2"/>
            <circle cx="962" cy="546" r="4.2"/>
            <circle cx="1098" cy="536" r="4.2"/>
            <circle cx="906" cy="498" r="4.2"/>
        </g>
        <circle cx="1012" cy="474" r="8" fill="#c084fc"/>
        <circle cx="1012" cy="474" r="34" fill="none" stroke="rgba(192,132,252,0.35)" stroke-width="1.2"/>
        <circle cx="1012" cy="474" r="62" fill="none" stroke="rgba(192,132,252,0.16)" stroke-width="1.2"/>
        <g fill="rgba(148,163,214,0.30)">
            <circle cx="856" cy="386" r="3"/>
            <circle cx="1140" cy="470" r="3"/>
            <circle cx="880" cy="596" r="3"/>
            <circle cx="1052" cy="352" r="3"/>
            <circle cx="812" cy="536" r="3"/>
        </g>
    </svg>

    <div class="frame"></div>

    <div class="content">
        <div class="badge"><span class="dot"></span>Open to international roles</div>
        <h1>Constantino<br>Ferrucci</h1>
        <h2>Senior Generative AI Engineer</h2>
        <p>Enterprise RAG architecture, retrieval quality, and the backend engineering that gets LLM systems into production.</p>
        <div class="meta">
            <span>Montevideo, UY</span>
            <span class="sep">/</span>
            <span class="site">constantinoferrucci.com.ar</span>
        </div>
    </div>

    <div class="mark">CF</div>
</body>
</html>
