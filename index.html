<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con IA - Constantino Ferrucci</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .config-section {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }

        .config-section label {
            display: block;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 5px;
        }

        .config-section input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }

        .config-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Custom Dropdown Styles */
        .model-selector {
            position: relative;
            margin-bottom: 10px;
        }

        .model-search {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.3s;
        }

        .model-search:focus {
            outline: none;
            border-color: #667eea;
        }

        .model-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #667eea;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .model-dropdown.show {
            display: block;
        }

        .model-option {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid #eee;
        }

        .model-option:last-child {
            border-bottom: none;
        }

        .model-option:hover {
            background: #f0f0ff;
        }

        .model-option.selected {
            background: #667eea;
            color: white;
        }

        .model-option .model-name {
            font-weight: 600;
        }

        .model-option .model-id {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .load-models-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        .load-models-btn:hover {
            transform: translateY(-1px);
        }

        .load-models-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .models-status {
            font-size: 0.8rem;
            color: #666;
            text-align: center;
            margin-bottom: 5px;
        }

        .chat-messages {
            height: 350px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
        }

        .message-label {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 4px;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .chat-input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .chat-input-container input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-input-container button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chat-input-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .chat-input-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            max-width: 80%;
        }

        .typing-indicator.show {
            display: block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            margin-right: 4px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .chat-messages::-webkit-scrollbar,
        .model-dropdown::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track,
        .model-dropdown::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-messages::-webkit-scrollbar-thumb,
        .model-dropdown::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Chat sobre Constantino Ferrucci</h1>
            <p>Experto en Inteligencia Artificial</p>
        </div>

        <div class="config-section">
            <label for="apiKey">API Key de OpenRouter:</label>
            <input type="password" id="apiKey" placeholder="sk-or-v1-..." onchange="onApiKeyChange()">

            <button class="load-models-btn" id="loadModelsBtn" onclick="loadModels()">Cargar Modelos</button>
            <div class="models-status" id="modelsStatus"></div>

            <label for="modelSearch">Modelo:</label>
            <div class="model-selector">
                <input type="text" class="model-search" id="modelSearch" placeholder="Buscar modelo..." onclick="toggleDropdown()" oninput="filterModels()">
                <div class="model-dropdown" id="modelDropdown"></div>
            </div>
            <input type="hidden" id="selectedModel" value="">
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <span class="message-label">Asistente</span>
                <div class="message-content">
                    Hola! Soy un asistente especializado en Constantino Ferrucci, desarrollador de IA de Rosario, Argentina. Trabaja en Wiener Lab y es instructor en la UNR. Preguntame sobre su formacion, experiencia o habilidades!
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        const SYSTEM_PROMPT = `Eres un asistente experto que conoce todo sobre Constantino Ferrucci, un talentoso desarrollador de Inteligencia Artificial de Rosario, Santa Fe, Argentina.

INFORMACION SOBRE CONSTANTINO FERRUCCI:

**Formacion Academica:**
- Actualmente cursando la Licenciatura en Inteligencia Artificial en la Universidad Nacional de Rosario (desde 2024)
- Tecnicatura en Inteligencia Artificial de la Universidad Nacional de Rosario (2022-2024)
- Tecnico Electromecanico egresado de la Escuela de Educacion Tecnica Profesional No 466 (2015-2020)

**Experiencia Profesional:**
- Desarrollador de IA en Wiener Lab (desde junio 2023): Trabaja en soluciones de IA para automatizacion de diagnosticos de laboratorio, pipelines de analisis de datos y asistentes virtuales, utilizando Python y Bash.
- Instructor en la Universidad Nacional de Rosario (desde octubre 2024): Ensena fundamentos de Computer Vision y Procesamiento de Lenguaje Natural (NLP) a estudiantes de grado.

**Habilidades Tecnicas:**
- Lenguajes y Frameworks: Python, PyTorch, TensorFlow, Hugging Face, LangChain, OpenAI API, Docker, FastAPI
- Matematicas aplicadas a IA: algebra lineal, probabilidad, calculo

**Idiomas:**
- Espanol nativo
- Ingles intermedio
- Conocimientos basicos de portugues y aleman

Responde siempre en espanol de manera amigable y profesional. Basa tus respuestas en la informacion proporcionada. Si te preguntan algo que no esta en esta informacion, puedes decir que no tienes esa informacion especifica.`;

        let conversationHistory = [];
        let allModels = [];
        let filteredModels = [];

        function onApiKeyChange() {
            document.getElementById('modelsStatus').textContent = '';
        }

        async function loadModels() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const loadBtn = document.getElementById('loadModelsBtn');
            const status = document.getElementById('modelsStatus');

            if (!apiKey) {
                alert('Por favor, ingresa tu API Key primero');
                return;
            }

            loadBtn.disabled = true;
            loadBtn.textContent = 'Cargando...';
            status.textContent = '';

            try {
                const response = await fetch('https://openrouter.ai/api/v1/models', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    }
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || 'Error al cargar modelos');
                }

                // Filtrar solo modelos text -> text
                allModels = data.data.filter(model => {
                    const inputModalities = model.architecture?.input_modalities || [];
                    const outputModalities = model.architecture?.output_modalities || [];
                    return inputModalities.includes('text') && outputModalities.includes('text');
                });

                // Ordenar por nombre
                allModels.sort((a, b) => a.name.localeCompare(b.name));

                filteredModels = [...allModels];
                renderDropdown();

                status.textContent = `${allModels.length} modelos cargados`;
                status.style.color = '#28a745';

            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                status.style.color = '#dc3545';
            }

            loadBtn.disabled = false;
            loadBtn.textContent = 'Cargar Modelos';
        }

        function renderDropdown() {
            const dropdown = document.getElementById('modelDropdown');
            dropdown.innerHTML = '';

            filteredModels.forEach(model => {
                const option = document.createElement('div');
                option.className = 'model-option';
                option.innerHTML = `
                    <div class="model-name">${model.name}</div>
                    <div class="model-id">(${model.id})</div>
                `;
                option.onclick = () => selectModel(model);
                dropdown.appendChild(option);
            });
        }

        function selectModel(model) {
            document.getElementById('modelSearch').value = `${model.name} (${model.id})`;
            document.getElementById('selectedModel').value = model.id;
            document.getElementById('modelDropdown').classList.remove('show');
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('modelDropdown');
            if (allModels.length > 0) {
                dropdown.classList.toggle('show');
            }
        }

        function filterModels() {
            const searchTerm = document.getElementById('modelSearch').value.toLowerCase();
            const dropdown = document.getElementById('modelDropdown');

            filteredModels = allModels.filter(model =>
                model.name.toLowerCase().includes(searchTerm) ||
                model.id.toLowerCase().includes(searchTerm)
            );

            renderDropdown();
            dropdown.classList.add('show');
        }

        // Cerrar dropdown al hacer click fuera
        document.addEventListener('click', (e) => {
            const selector = document.querySelector('.model-selector');
            if (!selector.contains(e.target)) {
                document.getElementById('modelDropdown').classList.remove('show');
            }
        });

        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const modelId = document.getElementById('selectedModel').value;
            const userInput = document.getElementById('userInput').value.trim();
            const chatMessages = document.getElementById('chatMessages');
            const sendBtn = document.getElementById('sendBtn');

            if (!apiKey) {
                alert('Por favor, ingresa tu API Key de OpenRouter');
                return;
            }

            if (!modelId) {
                alert('Por favor, carga y selecciona un modelo');
                return;
            }

            if (!userInput) return;

            // Agregar mensaje del usuario
            addMessage('user', userInput);
            document.getElementById('userInput').value = '';

            // Mostrar indicador de escritura
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator show';
            typingIndicator.innerHTML = '<span></span><span></span><span></span>';
            chatMessages.appendChild(typingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            sendBtn.disabled = true;

            // Agregar al historial
            conversationHistory.push({
                role: 'user',
                content: userInput
            });

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: modelId,
                        messages: [
                            { role: 'system', content: SYSTEM_PROMPT },
                            ...conversationHistory
                        ],
                        temperature: 0.8
                    })
                });

                const data = await response.json();

                // Remover indicador de escritura
                typingIndicator.remove();

                if (data.error) {
                    throw new Error(data.error.message || 'Error en la API');
                }

                const assistantMessage = data.choices[0].message.content;

                // Agregar al historial
                conversationHistory.push({
                    role: 'assistant',
                    content: assistantMessage
                });

                addMessage('assistant', assistantMessage);

            } catch (error) {
                typingIndicator.remove();
                addMessage('assistant', `Error: ${error.message}`);
            }

            sendBtn.disabled = false;
        }

        function addMessage(role, content) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const label = role === 'user' ? 'Tu' : 'Asistente';

            messageDiv.innerHTML = `
                <span class="message-label">${label}</span>
                <div class="message-content">${escapeHtml(content)}</div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
