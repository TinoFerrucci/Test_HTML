<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7fb;
            --surface: rgba(17, 17, 32, 0.035);
            --border: rgba(17, 17, 32, 0.10);
            --text: #14141f;
            --text-secondary: #4a4a5a;
            --text-muted: #63636f;
            --accent: #4f46e5;
            --accent-soft: rgba(79, 70, 229, 0.08);
            --on-accent: #ffffff;
            --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg: #050507;
                --surface: rgba(255, 255, 255, 0.04);
                --border: rgba(255, 255, 255, 0.08);
                --text: #f0f0f5;
                --text-secondary: rgba(255, 255, 255, 0.66);
                --text-muted: rgba(255, 255, 255, 0.48);
                --accent: #6366f1;
                --accent-soft: rgba(99, 102, 241, 0.10);
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }
        main {
            max-width: 560px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 56px 40px;
        }
        .code {
            font-family: var(--mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: inline-block;
            padding: 6px 14px;
            margin-bottom: 20px;
        }
        h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); letter-spacing: -0.02em; margin-bottom: 12px; }
        p { color: var(--text-secondary); margin-bottom: 8px; }
        p.es { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 32px; }
        a.home {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 14px;
            background: var(--accent);
            color: var(--on-accent);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
        }
        a.home:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <span class="code">error 404</span>
        <h1>This page doesn't exist</h1>
        <p>The link may be broken, or the page may have moved.</p>
        <p class="es">Esta p&aacute;gina no existe. El enlace puede estar roto o la p&aacute;gina se movi&oacute;.</p>
        <a class="home" href="/">Back to the portfolio</a>
    </main>
</body>
